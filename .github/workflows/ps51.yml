name: Windows PowerShell 5.1

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse production scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            '.\IS74Wifi.ps1',
            '.\agent.ps1',
            '.\src\IS74Wifi.psm1'
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parser errors in $file"
            }
          }

      - name: Import production module with Windows PowerShell 5.1
        shell: powershell
        run: |
          Import-Module .\src\IS74Wifi.psm1 -Force
          Get-Command -Module IS74Wifi | Out-String | Write-Host

      - name: Static checks
        shell: powershell
        run: py -3 .\tests\static_checks.py
