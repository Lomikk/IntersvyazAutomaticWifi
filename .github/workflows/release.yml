name: Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        shell: pwsh
        run: |
          $program = Get-Content './src/IS74Wifi.App/Program.cs' -Raw
          $match = [regex]::Match(
            $program,
            'private const string ProductVersion = "(?<tag>v[0-9]+[.][0-9]+[.][0-9]+(?:-alpha[.][0-9]+)?)";'
          )
          if (-not $match.Success) {
            throw 'Could not read ProductVersion from Program.cs.'
          }

          $tag = $match.Groups['tag'].Value
          if ($tag -notmatch '^v[0-9]+[.][0-9]+[.][0-9]+(?:-alpha[.][0-9]+)?$') {
            throw "Unsupported release version: $tag"
          }

          $isPrerelease = $tag.Contains('-alpha.')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Release tag: $tag"
          Write-Host "Prerelease: $isPrerelease"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build C# runtime
        run: |
          dotnet restore ./IS74Wifi.slnx
          dotnet build ./IS74Wifi.slnx --configuration Release --no-restore

      - name: C# contract tests
        run: dotnet run --project ./tests/IS74Wifi.ContractTests/IS74Wifi.ContractTests.csproj --configuration Release --no-build

      - name: PowerShell reference regression checks
        shell: powershell
        run: |
          $files = @(
            './IS74Wifi.ps1',
            './agent.ps1',
            './src/IS74Wifi.psm1',
            './tests/critical_path_contract.ps1'
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parser errors in $file"
            }
          }

          Import-Module ./src/IS74Wifi.psm1 -Force
          ./tests/critical_path_contract.ps1
          py -3 ./tests/static_checks.py

      - name: Restore NativeAOT runtime assets
        run: dotnet restore ./src/IS74Wifi.App/IS74Wifi.App.csproj --runtime win-x64 -p:PublishAot=true

      - name: Publish NativeAOT win-x64
        shell: pwsh
        run: |
          dotnet publish ./src/IS74Wifi.App/IS74Wifi.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishAot=true `
            -p:StripSymbols=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output ./artifacts/nativeaot

      - name: Smoke NativeAOT release
        shell: pwsh
        run: |
          $exe = Resolve-Path './artifacts/nativeaot/IS74Wifi.exe'

          $p = Start-Process -FilePath $exe -ArgumentList 'version' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "NativeAOT version smoke failed: $($p.ExitCode)"
          }

          $old = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'is74-release-state'

            $p = Start-Process -FilePath $exe -ArgumentList 'status' -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              throw "NativeAOT status smoke failed: $($p.ExitCode)"
            }

            $p = Start-Process -FilePath $exe -ArgumentList 'agent' -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              throw "NativeAOT clean-state agent smoke failed: $($p.ExitCode)"
            }
          }
          finally {
            $env:LOCALAPPDATA = $old
          }

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $packageBase = "IS74Wifi-$tag-win-x64"
          $dist = Join-Path $PWD 'dist'
          $staging = Join-Path $dist $packageBase
          New-Item -ItemType Directory -Force $staging | Out-Null

          Copy-Item './artifacts/nativeaot/IS74Wifi.exe' $staging

          $files = @(Get-ChildItem -Path $staging -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'IS74Wifi.exe') {
            throw 'Release archive must contain exactly one runtime file: IS74Wifi.exe'
          }

          $zipPath = Join-Path $dist "$packageBase.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
            if ($entries.Count -ne 1 -or $entries[0] -ne 'IS74Wifi.exe') {
              throw "Unexpected archive contents: $($entries -join ', ')"
            }
          }
          finally {
            $zip.Dispose()
          }

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashPath = "$zipPath.sha256"
          "$hash  $([IO.Path]::GetFileName($zipPath))" | Set-Content $hashPath -Encoding ascii -NoNewline

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "hash_path=$hashPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IS74Wifi-${{ steps.release.outputs.tag }}-win-x64
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.hash_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $repo = '${{ github.repository }}'
          $zip = '${{ steps.package.outputs.zip_path }}'
          $hashFile = '${{ steps.package.outputs.hash_path }}'
          $hash = '${{ steps.package.outputs.sha256 }}'
          $isPrerelease = '${{ steps.release.outputs.prerelease }}' -eq 'true'

          $notes = @"
          Windows x64 C# / .NET 10 NativeAOT release.

          Package:
          - one self-contained IS74Wifi.exe
          - SHA-256: $hash

          The release was built from ProductVersion $tag and passed C# contract tests,
          PowerShell reference regression checks, NativeAOT publish, version/status smoke,
          and clean-state agent smoke before publication.
          "@

          $args = @(
            'release', 'create', $tag, $zip, $hashFile,
            '--repo', $repo,
            '--target', '${{ github.sha }}',
            '--title', "IS74Wifi $tag",
            '--notes', $notes
          )

          if ($isPrerelease) {
            $args += '--prerelease'
          }

          & gh @args
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed: $LASTEXITCODE"
          }
