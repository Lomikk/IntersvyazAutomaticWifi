name: Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/release-trigger'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        shell: pwsh
        run: |
          $program = Get-Content './src/IS74Wifi.App/Program.cs' -Raw
          $match = [regex]::Match(
            $program,
            'private const string ProductVersion = "(?<tag>v[0-9]+[.][0-9]+[.][0-9]+(?:-alpha[.][0-9]+)?)";'
          )
          if (-not $match.Success) {
            throw 'Could not read ProductVersion from Program.cs.'
          }

          $tag = $match.Groups['tag'].Value
          if ($tag -notmatch '^v[0-9]+[.][0-9]+[.][0-9]+(?:-alpha[.][0-9]+)?$') {
            throw "Unsupported release version: $tag"
          }

          $isPrerelease = $tag.Contains('-alpha.')

          if ('${{ github.event_name }}' -eq 'push') {
            $triggerTag = (Get-Content './.github/release-trigger' -Raw).Trim()
            if ($triggerTag -ne $tag) {
              throw "Release trigger $triggerTag does not match ProductVersion $tag."
            }
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Release tag: $tag"
          Write-Host "Prerelease: $isPrerelease"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build C# runtime
        run: |
          dotnet restore ./IS74Wifi.slnx
          dotnet build ./IS74Wifi.slnx --configuration Release --no-restore

      - name: C# contract tests
        run: dotnet run --project ./tests/IS74Wifi.ContractTests/IS74Wifi.ContractTests.csproj --configuration Release --no-build

      - name: PowerShell reference regression checks
        shell: powershell
        run: |
          $files = @(
            './IS74Wifi.ps1',
            './agent.ps1',
            './src/IS74Wifi.psm1',
            './tests/critical_path_contract.ps1'
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parser errors in $file"
            }
          }

          Import-Module ./src/IS74Wifi.psm1 -Force
          ./tests/critical_path_contract.ps1

      - name: Legacy static checks
        shell: powershell
        run: py -3 ./tests/static_checks.py

      - name: Restore NativeAOT runtime assets
        run: dotnet restore ./src/IS74Wifi.App/IS74Wifi.App.csproj --runtime win-x64 -p:PublishAot=true

      - name: Publish NativeAOT win-x64
        shell: pwsh
        run: |
          dotnet publish ./src/IS74Wifi.App/IS74Wifi.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishAot=true `
            -p:StripSymbols=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output ./artifacts/nativeaot

      - name: Smoke NativeAOT release
        shell: pwsh
        run: |
          $exe = Resolve-Path './artifacts/nativeaot/IS74Wifi.exe'

          $p = Start-Process -FilePath $exe -ArgumentList 'version' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "NativeAOT version smoke failed: $($p.ExitCode)"
          }

          $old = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'is74-release-state'

            $p = Start-Process -FilePath $exe -ArgumentList 'status' -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              throw "NativeAOT status smoke failed: $($p.ExitCode)"
            }

            $p = Start-Process -FilePath $exe -ArgumentList 'agent' -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              throw "NativeAOT clean-state agent smoke failed: $($p.ExitCode)"
            }
          }
          finally {
            $env:LOCALAPPDATA = $old
          }

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $packageBase = "IS74Wifi-$tag-win-x64"
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null

          # Primary artifact: publish the NativeAOT executable directly.
          $exePath = Join-Path $dist "$packageBase.exe"
          Copy-Item './artifacts/nativeaot/IS74Wifi.exe' $exePath -Force
          $exeHash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHashPath = "$exePath.sha256"
          "$exeHash  $([IO.Path]::GetFileName($exePath))" | Set-Content $exeHashPath -Encoding ascii -NoNewline

          "exe_path=$exePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe_hash_path=$exeHashPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe_sha256=$exeHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IS74Wifi-${{ steps.release.outputs.tag }}-win-x64
          path: |
            ${{ steps.package.outputs.exe_path }}
            ${{ steps.package.outputs.exe_hash_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $repo = '${{ github.repository }}'
          $exe = '${{ steps.package.outputs.exe_path }}'
          $exeHashFile = '${{ steps.package.outputs.exe_hash_path }}'
          $exeHash = '${{ steps.package.outputs.exe_sha256 }}'
          $isPrerelease = '${{ steps.release.outputs.prerelease }}' -eq 'true'

          $notes = @"
          Windows x64 C# / .NET 10 NativeAOT release.

          Primary download:
          - self-contained IS74Wifi.exe
          - SHA-256: $exeHash

          The release was built from ProductVersion $tag and passed C# contract tests,
          PowerShell reference regression checks, NativeAOT publish, version/status smoke,
          and clean-state agent smoke before publication.
          "@

          $args = @(
            'release', 'create', $tag, $exe, $exeHashFile,
            '--repo', $repo,
            '--target', '${{ github.sha }}',
            '--title', "IS74Wifi $tag",
            '--notes', $notes
          )

          if ($isPrerelease) {
            $args += '--prerelease'
          }

          & gh @args
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed: $LASTEXITCODE"
          }

      - name: Publish update manifest
        shell: pwsh
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $exeHash = '${{ steps.package.outputs.exe_sha256 }}'
          $isPrerelease = '${{ steps.release.outputs.prerelease }}' -eq 'true'
          $manifestPath = Join-Path $PWD 'update-manifest.json'

          if (Test-Path $manifestPath) {
            $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json -AsHashtable
          }
          else {
            $manifest = @{ schema = 1; stable = $null; prerelease = $null }
          }

          if ([int]$manifest.schema -ne 1) {
            throw "Unsupported update manifest schema: $($manifest.schema)"
          }

          function Parse-ReleaseVersion([string]$value) {
            $m = [regex]::Match($value, '^v(?<major>\d+)[.](?<minor>\d+)[.](?<patch>\d+)(?:-alpha[.](?<alpha>\d+))?$')
            if (-not $m.Success) { throw "Unsupported manifest version: $value" }
            [pscustomobject]@{
              Major = [int]$m.Groups['major'].Value
              Minor = [int]$m.Groups['minor'].Value
              Patch = [int]$m.Groups['patch'].Value
              Alpha = if ($m.Groups['alpha'].Success) { [int]$m.Groups['alpha'].Value } else { $null }
            }
          }

          function Compare-ReleaseVersion([string]$left, [string]$right) {
            $a = Parse-ReleaseVersion $left
            $b = Parse-ReleaseVersion $right
            foreach ($name in @('Major', 'Minor', 'Patch')) {
              if ($a.$name -lt $b.$name) { return -1 }
              if ($a.$name -gt $b.$name) { return 1 }
            }
            if ($null -eq $a.Alpha -and $null -eq $b.Alpha) { return 0 }
            if ($null -eq $a.Alpha) { return 1 }
            if ($null -eq $b.Alpha) { return -1 }
            return [Math]::Sign($a.Alpha - $b.Alpha)
          }

          $entry = [ordered]@{
            version = $tag
            sha256 = $exeHash
          }

          if (-not $isPrerelease) {
            $manifest.stable = $entry
          }

          # The prerelease-enabled channel means "stable + prerelease". Keep
          # whichever allowed release is actually newest by our SemVer rules.
          if (
            $null -eq $manifest.prerelease -or
            (Compare-ReleaseVersion $tag ([string]$manifest.prerelease.version)) -gt 0
          ) {
            $manifest.prerelease = $entry
          }

          $json = $manifest | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText($manifestPath, $json + "`n", [Text.UTF8Encoding]::new($false))

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- update-manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Update manifest already matches this release.'
            exit 0
          }

          git commit -m "chore: publish update manifest for $tag"
          if ($LASTEXITCODE -ne 0) {
            throw "git commit failed: $LASTEXITCODE"
          }

          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) {
            throw "git pull --rebase failed: $LASTEXITCODE"
          }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            throw "git push failed: $LASTEXITCODE"
          }
