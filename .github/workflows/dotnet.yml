name: Client checks

on:
  push:
    branches: [ main ]
    paths:
      - 'IS74Wifi.slnx'
      - 'src/IS74Wifi.App/**'
      - 'src/IS74Wifi.Core/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'IS74Wifi.ps1'
      - 'agent.ps1'
      - 'src/IS74Wifi.psm1'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'IS74Wifi.slnx'
      - 'src/IS74Wifi.App/**'
      - 'src/IS74Wifi.Core/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'IS74Wifi.ps1'
      - 'agent.ps1'
      - 'src/IS74Wifi.psm1'
      - '.github/workflows/dotnet.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Full public checks (private backend explicitly skipped)
        shell: pwsh
        run: ./scripts/check.ps1 -Mode Full -SkipBackend -Configuration Release

      - name: Smoke test CLI
        shell: pwsh
        run: |
          $exe = Resolve-Path '.\artifacts\check\Release\app\IS74Wifi.exe'
          $process = Start-Process -FilePath $exe -ArgumentList 'version' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "version smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Verify real agent mode is consoleless on clean state
        shell: pwsh
        run: |
          $exe = Resolve-Path '.\artifacts\check\Release\app\IS74Wifi.exe'
          $oldLocalAppData = $env:LOCALAPPDATA
          $oldRunLocal = $env:IS74W_RUN_LOCAL
          try {
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'is74-checks-clean-state'
            $env:IS74W_RUN_LOCAL = '1'
            $process = Start-Process -FilePath $exe -ArgumentList 'agent' -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "clean-state agent smoke test failed with exit code $($process.ExitCode)"
            }
          }
          finally {
            $env:LOCALAPPDATA = $oldLocalAppData
            $env:IS74W_RUN_LOCAL = $oldRunLocal
          }
