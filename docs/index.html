          }
          put(frame, left + col, top + row, ch, palette);
        }
      }
    }
    function drawItems(frame, x, startY, paneWidth, rows) {
      for (let i = 0; i < MENU.length && i < rows; i++) {
        const item = MENU[i];
        const y = startY + i;
        const active = i === selected;
        put(frame, x, y, active ? "› " : "  ", active ? "highlight" : "text");
        put(frame, x + 2, y, "[" + item.key + "]", "dim");
        const labelWidth = Math.max(1, paneWidth - 10);
        if (item.id === "download") {
          put(frame, x + 6, y, truncate(item.label, labelWidth), active ? "bright" : "brand-bright");
        } else if (item.action === "qr-app" || item.action === "qr-support") {
          const hint = "  [QR ›]";
          const fits = item.label.length + hint.length <= labelWidth;
          put(frame, x + 6, y, truncate(item.label, fits ? labelWidth : Math.max(1, labelWidth - 2)), active ? "bright" : "text");
          if (fits) put(frame, x + 6 + item.label.length, y, hint, "highlight");
          else put(frame, x + 6 + labelWidth - 1, y, "›", "highlight");
        } else {
          put(frame, x + 6, y, truncate(item.label, labelWidth), active ? "bright" : "text");
        }
      }
    }
    function drawDescription(frame, x, y, width, maxLines) {
      const info = contentFor(MENU[selected]);
      const maxWidth = Math.max(12, width - 6);
      let lineY = y;
      if (MENU[selected].id === "support") {
        put(frame, x, lineY, "★", "warning");
        put(frame, x + 2, lineY++, truncate(info.title, maxWidth - 2), "highlight");
      } else {
        put(frame, x, lineY++, truncate(info.title, maxWidth), "brand-bright");
      }
      lineY++;
      for (const paragraph of info.lines) {
        if (lineY >= y + maxLines) break;
        if (!paragraph) { lineY++; continue; }
        for (const line of wrap(paragraph, maxWidth)) {
          if (lineY >= y + maxLines) break;
          put(frame, x, lineY++, line, "text");
        }
      }
    }
    function drawRich(frame, now, elapsed) {
      if (elapsed < 470) {
        banner(frame, 7, "initial", -7 + elapsed / 470 * (BANNER_WIDTH + 14));
        return [];
      }
      if (elapsed < 590) {
        const progress = (elapsed - 470) / 120;
        const top = Math.max(0, Math.ceil((7 - progress * 7) / 2) * 2);
        banner(frame, top, "final", 0);
        center(frame, Math.min(frame.length - 1, top + 13), SUBTITLE, "dim");
        return [];
      }
      const head = ambientStarted === null ? null : -7 + (now - ambientStarted) / 620 * (BANNER_WIDTH + 14);
      banner(frame, 0, head === null ? "final" : "ambient", head ?? 0);
      center(frame, 13, SUBTITLE, "dim");
      const w = frame[0].length;
      const gap = w >= 100 ? 4 : 3;
      const paneWidth = Math.max(30, Math.floor((w - 2 - gap) / 2));
      const leftX = 1;
      const rightX = 1 + paneWidth + gap;
      box(frame, leftX, 14, paneWidth, 14, "МЕНЮ");
      box(frame, rightX, 14, paneWidth, 14, "ОПИСАНИЕ");
      drawItems(frame, leftX + 3, 16, paneWidth, 8);
      drawDescription(frame, rightX + 3, 16, paneWidth, 10);
      center(frame, 29, "↑ ↓ выбрать     Enter открыть", "dim");
      return MENU.map((_, i) => 16 + i);
    }
    function drawCompact(frame) {
      center(frame, 1, "IS74W · InterSvyaz Wi-Fi Auth", "brand-bright");
      const w = frame[0].length;
      box(frame, 1, 4, w - 2, 13, "МЕНЮ");
      drawItems(frame, 4, 6, w - 2, 8);
      box(frame, 1, 19, w - 2, 14, "ОПИСАНИЕ");
      drawDescription(frame, 4, 21, w - 2, 10);
      center(frame, 34, "↑ ↓ выбрать   Enter открыть", "dim");
      return MENU.map((_, i) => 6 + i);
    }
    function drawQr(frame) {
      const width = frame[0].length;
      const height = frame.length;
      const isApp = qrPage === "app";
      const qr = QR_CODES[qrPage];
      const qrWidth = Math.max(...qr.map(line => line.length));
      box(frame, 1, 0, width - 2, height - 2, isApp ? "ПРИЛОЖЕНИЕ ИНТЕРСВЯЗЬ" : "ПОДДЕРЖАТЬ ПРОЕКТ");
      center(frame, 1, truncate(isApp ?
        "Для работы IS74Wifi нужен аккаунт в приложении «Интерсвязь»." :
        "IS74Wifi — бесплатный независимый проект.", width - 4), "text");
      center(frame, 2, truncate(isApp ?
        "Установите приложение и зарегистрируйтесь." :
        "Если программа полезна, можно поддержать её развитие.", width - 4), "text");
      if (width >= qrWidth + 6) {
        const top = (height > 30 ? 6 : 4) + Math.floor((20 - qr.length) / 2);
        const left = Math.floor((width - qrWidth) / 2);
        for (let i = 0; i < qr.length; i++) put(frame, left, top + i, qr[i], "qr");
      } else {
        center(frame, Math.floor(height / 2) - 1, "QR-код не помещается по ширине.", "warning");
        center(frame, Math.floor(height / 2) + 1, "Откройте ссылку ниже.", "text");
      }
      const linkRow = height - 5;
      center(frame, linkRow, "[ ОТКРЫТЬ ССЫЛКУ ]", "highlight");
      center(frame, height - 1, "Esc — назад   Enter — открыть ссылку", "dim");
      return linkRow;
    }
    function measureColumns() {
      const charWidth = measure.getBoundingClientRect().width / 10 || 8.5;
      return Math.max(30, Math.floor((viewport.clientWidth - 2) / charWidth));
    }
    function qrUrl() { return qrPage === "app" ? MOBILE_APP_URL : SUPPORT_URL; }
    function buildMarkup(frame, clickableRows, linkRow = -1, backRow = -1) {
      return frame.map((row, y) => {
        const chunks = [];
        let palette = row[0].p;
        let characters = "";
        for (const cell of row) {
          if (cell.p !== palette) {
            chunks.push('<span class="p-' + palette + '">' + escapeHtml(characters) + '</span>');
            palette = cell.p;
            characters = "";
          }
          characters += cell.c;
        }
        chunks.push('<span class="p-' + palette + '">' + escapeHtml(characters) + '</span>');
        const rowClass = row.some(cell => cell.p === "qr") ? "row qr-row" : "row";
        if (y === linkRow) {
          return '<a class="' + rowClass + ' qr-link" href="' + escapeHtml(qrUrl()) + '" target="_blank" rel="noopener noreferrer" aria-label="Открыть ссылку для QR-кода">' + chunks.join("") + '</a>';
        }
        const optionIndex = clickableRows.indexOf(y);
        const optionAttribute = optionIndex >= 0 ? ' data-option="' + optionIndex + '" title="' + escapeHtml(MENU[optionIndex].label) + '"' : "";
        const backAttribute = y === backRow ? ' data-qr-back="1" title="Вернуться в меню"' : "";
        return '<div class="' + rowClass + '"' + optionAttribute + backAttribute + '>' + chunks.join("") + '</div>';
      }).join("");
    }
    function render(now = performance.now()) {
      const columns = measureColumns();
      const compact = columns < 80;
      currentWidth = compact ? Math.max(30, columns - 1) : Math.min(116, Math.max(79, columns - 1));
      const frame = canvas(currentWidth, qrPage || compact ? 35 : 30);
      if (ambientStarted !== null && now - ambientStarted >= 620) {
        ambientStarted = null;
        nextSweep = now + random(18000, 31000);
      }
      if (ambientStarted === null && now >= nextSweep) ambientStarted = now;
      const elapsed = matchMedia("(prefers-reduced-motion: reduce)").matches ? 9999 : now - revealStarted;
      const linkRow = qrPage ? drawQr(frame) : -1;
      const clickRows = qrPage ? [] : compact ? drawCompact(frame) : drawRich(frame, now, elapsed);
      const markup = buildMarkup(frame, clickRows, linkRow, qrPage ? frame.length - 1 : -1);
      if (markup !== lastMarkup) { screen.innerHTML = markup; lastMarkup = markup; }
      const announcementKey = qrPage ?? selected;
      if (announcementKey !== lastAriaIndex) {
        announcement.textContent = qrPage ?
          (qrPage === "app" ? "QR-код мобильного приложения Интерсвязь" : "QR-код поддержки проекта через ЮMoney") + ". Нажмите Enter, чтобы открыть ссылку, или Esc, чтобы вернуться." :
          MENU[selected].label + ". " + contentFor(MENU[selected]).lines.filter(Boolean).join(" ");
        screen.setAttribute("aria-label", qrPage ? "QR-код. Enter открыть ссылку, Esc назад." : "Интерактивное меню IS74Wifi. Стрелки, цифры, Enter.");
        lastAriaIndex = announcementKey;
      }
    }
    function select(index) {
      selected = (index + MENU.length) % MENU.length;
      render();
    }
    function activate() {
      const action = MENU[selected].action;
      if (action === "download") {
        window.location.assign(download.url);
      } else if (action === "qr-app" || action === "qr-support") {
        qrPage = action === "qr-app" ? "app" : "support";
        render();
      } else if (action === "releases" || action === "source") {
        window.open(action === "releases" ? LATEST_RELEASE : SOURCE_URL, "_blank", "noopener,noreferrer");
      } else {
        render();
      }
    }
    screen.addEventListener("click", event => {
      if (qrPage) {
        if (event.target.closest("[data-qr-back]")) { qrPage = null; render(); }
        return;
      }
      const row = event.target.closest("[data-option]");
      if (!row) return;
      const index = Number(row.dataset.option);
      select(index);
      screen.focus({ preventScroll: true });
      if (MENU[index].action) activate();
    });
    window.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (qrPage) {
        if (event.key === "Escape" || event.key === "Backspace") {
          event.preventDefault();
          qrPage = null;
          render();
        } else if (event.key === "Enter") {
          event.preventDefault();
          window.open(qrUrl(), "_blank", "noopener,noreferrer");
        }
        return;
      }
      if (event.key === "ArrowUp") { event.preventDefault(); select(selected - 1); }
      else if (event.key === "ArrowDown") { event.preventDefault(); select(selected + 1); }
      else if (event.key === "Enter") { event.preventDefault(); activate(); }
      else if (MENU.some(item => item.key === event.key)) {
        event.preventDefault();
        select(MENU.findIndex(item => item.key === event.key));
        if (MENU[selected].action) activate();
      }
    });
    window.addEventListener("resize", () => { lastMarkup = ""; render(); rebuildAmbient(); });

    // GitHub API используется только для определения самого нового EXE, включая pre-release.
    fetch(RELEASE_API, { headers: { Accept: "application/vnd.github+json" } })
      .then(response => { if (!response.ok) throw new Error("GitHub API"); return response.json(); })
      .then(releases => {
        const candidates = releases.filter(release => !release.draft && release.published_at)
          .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
        for (const release of candidates) {
          const asset = release.assets?.find(file => /win-x64\.exe$/i.test(file.name));
          if (asset && asset.browser_download_url) {
            download = { version: release.tag_name, bytes: asset.size, url: asset.browser_download_url };
            render();
            break;
          }
        }
      })
      .catch(() => { /* При недоступности API остаётся проверенный EXE alpha.48. */ });

    // Обновляем символы только во время самой анимации и при действиях пользователя.
    function frameLoop(now) {
      const activeReveal = now - revealStarted < 600 && !matchMedia("(prefers-reduced-motion: reduce)").matches;
      const activeAmbient = ambientStarted !== null || now >= nextSweep;
      if (!qrPage && (activeReveal || activeAmbient)) render(now);
      requestAnimationFrame(frameLoop);
    }
    render();
    rebuildAmbient();
    requestAnimationFrame(frameLoop);
  </script>
</body>
</html>
